version: "3.9"

services:
  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Persists uploaded zips across container restarts
      - site_uploads:/var/uploads/sites
      # Mount your Proxmox SSH private key as a secret
      - type: bind
        source: ${PROXMOX_SSH_KEY_PATH:-/run/secrets/proxmox_ssh_key}
        target: /run/secrets/proxmox_ssh_key
        read_only: true
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  site_uploads:
